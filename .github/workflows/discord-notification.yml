name: Discord notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to Discord
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"🚀 New commit pushed to master\nhttps://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}\"
            }" \
            $DISCORD_WEBHOOK_URL
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
